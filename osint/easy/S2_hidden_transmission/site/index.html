<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RavenSearch</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .hero{max-width:560px;margin:12vh auto 0;text-align:center;padding:0 20px}
  .logo{font-size:44px;font-weight:800;letter-spacing:1px;margin-bottom:18px}
  .logo .b2{color:var(--accent)}
  .searchbox{display:flex;gap:8px}
  .searchbox input{flex:1;padding:12px 16px;border:1px solid #cfd6dd;
    border-radius:24px;font-size:16px}
  .trend{margin-top:26px;text-align:left;font-size:14px}
  .trend a{display:inline-block;margin:4px 8px 4px 0;background:#eef2f5;
    border:1px solid var(--line);border-radius:14px;padding:3px 11px}
</style>
</head>
<body>
  <div class="hero">
    <div class="logo">Raven<span class="b2">Search</span></div>
    <!-- query ignored server-side; results page is static -->
    <form class="searchbox" action="results.html" method="get">
      <input type="text" name="q" placeholder="Search the public web…" autofocus>
      <button class="btn" type="submit">Search</button>
    </form>
    <div class="trend">
      <div class="muted">Recent public queries:</div>
      <a href="results.html?q=RAVEN-17">RAVEN-17</a>
      <a href="results.html?q=GuardianOS+breach">GuardianOS breach</a>
      <a href="results.html?q=WATCHTOWER+project">WATCHTOWER project</a>
    </div>
  </div>
  <footer class="lab">RAVEN//TRACE CTF · S2 Hidden Transmission · isolated lab environment — all sites, people &amp; data are fictional.</footer>
</body>
</html>
