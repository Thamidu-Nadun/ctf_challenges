<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Who Is Admin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100">
    <main
      class="mx-auto flex min-h-screen max-w-6xl items-center justify-center px-4 py-12"
    >
      <section
        class="grid w-full max-w-4xl overflow-hidden rounded-2xl bg-white shadow-2xl md:grid-cols-2"
      >
        <div class="hidden bg-slate-900 p-10 text-white md:block">
          <p class="text-sm uppercase tracking-[0.2em] text-slate-300">
            CTF Platform
          </p>
          <h1 class="mt-4 text-4xl font-bold leading-tight">Who Is Admin</h1>
          <p class="mt-4 text-slate-300">
            Authenticate to continue and access your user dashboard.
          </p>
        </div>

        <div class="p-8 sm:p-10">
          <h2 class="text-2xl font-bold text-slate-900">Sign In</h2>
          <p class="mt-2 text-sm text-slate-600">
            Enter your credentials below.
          </p>

          {% if error %}
          <div
            class="mt-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
          >
            {{ error }}
          </div>
          {% endif %}

          <form action="/dashboard" method="POST" class="mt-6 space-y-5">
            <div>
              <label
                for="username"
                class="mb-1 block text-sm font-medium text-slate-700"
                >Username</label
              >
              <input
                id="username"
                name="username"
                type="text"
                required
                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20"
                placeholder="admin"
              />
            </div>

            <div>
              <label
                for="password"
                class="mb-1 block text-sm font-medium text-slate-700"
                >Password</label
              >
              <input
                id="password"
                name="password"
                type="password"
                required
                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20"
                placeholder="••••••••"
              />
            </div>

            <button
              type="submit"
              class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-700"
            >
              Continue
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
