<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping Me Maybe</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-4"
  >
    <main class="w-full max-w-lg">
      <div
        class="rounded-2xl border border-slate-800 bg-slate-900/80 shadow-2xl shadow-black/30 backdrop-blur"
      >
        <!-- Header -->
        <div class="border-b border-slate-800 px-6 py-5">
          <div class="flex items-center gap-3">
            <div
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-500/10 text-blue-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8 9l3 3-3 3m5 0h3M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"
                />
              </svg>
            </div>

            <div>
              <h1 class="text-xl font-semibold tracking-tight">
                Ping Me Maybe
              </h1>
              <p class="text-sm text-slate-400">Check connectivity to a host</p>
            </div>
          </div>
        </div>

        <!-- Form -->
        <div class="p-6">
          <form method="POST" class="space-y-4">
            <div>
              <label
                for="host"
                class="mb-2 block text-sm font-medium text-slate-300"
              >
                Host
              </label>

              <input
                id="host"
                type="text"
                name="host"
                placeholder="example.com or 8.8.8.8"
                required
                autocomplete="off"
                class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
              />
            </div>

            <button
              type="submit"
              class="flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900 active:bg-blue-700"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                />
              </svg>
              Ping Host
            </button>
          </form>

          {% if output %}
          <div class="mt-6">
            <div class="mb-2 flex items-center justify-between">
              <span class="text-sm font-medium text-slate-300"> Output </span>
              <span class="text-xs text-slate-500">terminal</span>
            </div>

            <pre
              class="max-h-80 overflow-auto rounded-xl border border-slate-800 bg-black/50 p-4 font-mono text-xs leading-6 text-emerald-400 shadow-inner"
            >
{{ output }}</pre
            >
          </div>
          {% endif %}
        </div>
      </div>

      <p class="mt-4 text-center text-xs text-slate-600">
        Network diagnostics tool
      </p>
    </main>
  </body>
</html>
