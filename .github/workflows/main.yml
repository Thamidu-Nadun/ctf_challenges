name: Build and Push All Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '*/Dockerfile'
      - '*/*/Dockerfile'
      - '*/*/*/Dockerfile'
      - '*/Dockerfile*'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push all Docker images
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          #!/bin/bash
          set -e

          if [ -z "$DOCKER_HUB_USERNAME" ]; then
              echo "Error: DOCKER_HUB_USERNAME secret not set"
              exit 1
          fi

          echo "========================================="
          echo "Docker Build & Push All Images"
          echo "========================================="
          echo "Docker Hub Username: $DOCKER_HUB_USERNAME"
          echo "Tag: $TAG"
          echo ""

          DOCKERFILES=$(find . -name "Dockerfile" -type f | sort)

          if [ -z "$DOCKERFILES" ]; then
              echo "No Dockerfiles found!"
              exit 1
          fi

          DOCKERFILE_COUNT=$(echo "$DOCKERFILES" | wc -l)
          echo "Found $DOCKERFILE_COUNT Dockerfile(s)"
          echo ""

          SUCCESSFUL=0
          FAILED=0

          while IFS= read -r dockerfile; do
              dir=$(dirname "$dockerfile")

              relative_path=${dir#./}
              # Replace / with -, remove special chars, convert to lowercase
              image_name=$(echo "$relative_path" | tr '/' '-' | sed 's/[^a-zA-Z0-9._-]//g' | tr '[:upper:]' '[:lower:]' | sed 's/-$//')

              full_image="${DOCKER_HUB_USERNAME}/${image_name}:${TAG}"

              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Building: $full_image"
              echo "Directory: $dir"
              echo ""

              if docker build -t "$full_image" "$dir"; then
                  echo "✓ Build successful"

                  if docker push "$full_image"; then
                      echo "✓ Push successful"
                      ((SUCCESSFUL++))
                  else
                      echo "✗ Push failed"
                      ((FAILED++))
                  fi
              else
                  echo "✗ Build failed"
                  ((FAILED++))
              fi
              echo ""
          done <<< "$DOCKERFILES"

          echo "========================================="
          echo "Summary"
          echo "========================================="
          echo "Successful: $SUCCESSFUL"
          echo "Failed: $FAILED"

          if [ $FAILED -gt 0 ]; then
              exit 1
          fi
